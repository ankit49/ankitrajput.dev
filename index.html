<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ankit Rajput</title>

    <!------------ Fonts ------------>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wdth,wght@0,62.5..100,100..900;1,62.5..100,100..900&display=swap" rel="stylesheet" />
    <!------------ Css ------------>
    <link rel="stylesheet" href="./styles/output.css" />
  </head>
  <body class="text-secondaryText relative">
    <!-- <div id="navbar-desktop"></div>
    <div id="navbar-mobile"></div> -->
    <div class="w-full bg-primaryBg">
      <section id="header"></section>
      <section id="home"></section>
      <section id="about" class="py-16"></section>
      <section id="skills" class="pt-16 pb-24"></section>
      <section id="resume" class="py-16"></section>
      <section id="contact" class="py-16"></section>

      <!-- Footer Section -->
      <footer class="py-8">
        <div class="max-w-screen-xl px-6 m-auto">
          <div class="mx-auto w-fit text-xs md:text-sm lg:text-base">
            Copyright @ 2024 | <span class="underline text-highlighter">Designed</span> and <span class="underline text-highlighter">Developed</span> by Ankit Rajput
          </div>
        </div>
      </footer>
    </div>

    <!------------ Scripts ------------>

    <script src="./scripts/main.js"></script>
    <script>
      const loadHTML = (id, file) => {
        return fetch(file)
          .then((res) => res.text())
          .then((data) => {
            document.getElementById(id).innerHTML = data;
          });
      };

      const loadAllSections = async () => {
        await Promise.all([
          loadHTML("header", "sections/header.html"),
          loadHTML("home", "sections/hero.html"),
          loadHTML("about", "sections/about.html"),
          loadHTML("skills", "sections/skills.html"),
          loadHTML("resume", "sections/resume.html"),
          loadHTML("contact", "sections/contact.html"),
        ]);

        init();
      };

      loadAllSections();
    </script>
  </body>
</html>
